[tool.poetry]
name = "ghosttype"
version = "0.5.0"
description = "Detect AI-generated slop in any text. Score it. Rewrite it."
authors = ["GhostType Developer <ghosttype@localhost>"]
readme = "README.md"
license = "MIT"
repository = "https://github.com/Zertannax/ghosttype"
keywords = ["ai", "detection", "slop", "text-analysis", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
packages = [{include = "ghosttype"}]

[tool.poetry.dependencies]
python = "^3.11"
typer = "^0.15.0"
rich = "^13.9.0"
fastembed = "^0.8.0"
datasets = "^4.8.5"

[tool.poetry.group.web]
optional = true

[tool.poetry.group.web.dependencies]
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
python-multipart = "^0.0.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
ruff = "^0.11.0"
mypy = "^1.15.0"

[tool.poetry.scripts]
ghosttype = "ghosttype.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"


[[tool.mypy.overrides]]
module = ["fastembed.*", "onnxruntime.*"]
ignore_missing_imports = true
